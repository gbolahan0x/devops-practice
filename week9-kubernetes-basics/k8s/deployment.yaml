apiVersion: apps/v1
kind: Deployment
metadata:
  name: week9-app
  namespace: devops-lab
  labels:
    app.kubernetes.io/name: week9-app
    app.kubernetes.io/part-of: devops-zero-to-hero
  annotations:
    kubernetes.io/change-cause: "Initial deployment of week9-app:v1"
spec:
  replicas: 2
  revisionHistoryLimit: 5

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: week9-app

  template:
    metadata:
      labels:
        app.kubernetes.io/name: week9-app
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: devops-zero-to-hero

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: week3-app
          image: week9-app:v1
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: week9-app-config

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      terminationGracePeriodSeconds: 30
