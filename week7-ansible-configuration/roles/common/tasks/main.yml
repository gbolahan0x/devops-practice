---
- name: Refresh the apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install common administration packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Install the managed message of the day
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
