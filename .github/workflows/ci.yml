name: DevOps CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-test:
    name: Test Node application
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Node tests in Docker
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace/week3-docker-compose/app \
            node:22-alpine \
            sh -c "npm ci && npm test"

  bash-syntax:
    name: Validate Bash scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate shell syntax
        shell: bash
        run: |
          find \
            week1-bash-automation \
            week2-config-management \
            -type f \
            -name '*.sh' \
            -print0 |
            xargs -0 -n1 bash -n

  terraform-format:
    name: Check Terraform formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Terraform formatting check
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            hashicorp/terraform:1.16.3 \
            fmt -check -recursive week4-iac-basics

  compose-integration:
    name: Test Docker Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_DB: week3_app
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ci_only_password_not_for_production

    defaults:
      run:
        working-directory: week3-docker-compose

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build application image
        run: docker compose build

      - name: Start application and database
        run: docker compose up -d

      - name: Show service status
        run: docker compose ps

      - name: Test application health
        run: |
          curl \
            --fail \
            --retry 20 \
            --retry-delay 2 \
            --retry-all-errors \
            http://localhost:3001/health

      - name: Test database connectivity
        run: |
          curl \
            --fail \
            --retry 20 \
            --retry-delay 2 \
            --retry-all-errors \
            http://localhost:3001/db-health

      - name: Show logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Clean up containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
